[package]
name = "asi-agent"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Sovereign evolutionary meta-harness nucleus"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "asi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.47", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

# Genome snapshots fingerprint several large standalone harness binaries. Keep
# that cryptographic primitive optimized in developer and acceptance builds.
[profile.dev.package.sha2]
opt-level = 3
